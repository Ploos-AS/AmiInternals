name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  m68k-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Native 68000 build
        run: bash ci/fs-uae/build-native.sh

      - name: Inspect evidence
        run: |
          test -s build/fs-uae/native/Info
          cat build/fs-uae/native/file.txt
          cat build/fs-uae/native/result.txt
