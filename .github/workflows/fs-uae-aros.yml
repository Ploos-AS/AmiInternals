name: FS-UAE AROS qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          # Chrome is preconfigured on GitHub-hosted runners but is unrelated to
          # AmiInternals qualification. Its rapidly changing package index can
          # transiently produce Hash Sum mismatch and prevent Ubuntu packages
          # from being installed, so keep this job isolated from that repo.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full unzip

      - name: Gate 1 - native 68000 build
        run: bash ci/fs-uae/build-native.sh

      - name: Gate 2 - execute M0-M2 inside AROS guest
        run: bash ci/fs-uae/run-aros-guest-smoke.sh

      - name: Gate 3 - execute M3 batch 1 inside AROS guest
        run: bash ci/fs-uae/run-m3-batch1-smoke.sh

      - name: Gate 4 - execute M3 batch 2 inside AROS guest
        run: bash ci/fs-uae/run-m3-batch2-smoke.sh

      - name: Gate 5 - execute M3 batch 3 inside AROS guest
        run: bash ci/fs-uae/run-m3-batch3-smoke.sh

      - name: Gate 6 - execute M4 batch 1 inside AROS guest
        run: bash ci/fs-uae/run-m4-batch1-smoke.sh

      - name: Gate 7 - execute M4 batch 2 inside AROS guest
        run: bash ci/fs-uae/run-m4-batch2-smoke.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-uae-aros-qualification
          path: |
            build/fs-uae/native/Info
            build/fs-uae/native/TaskInfo
            build/fs-uae/native/ExecInfo
            build/fs-uae/native/Interrupts
            build/fs-uae/native/Vectors
            build/fs-uae/native/Patches
            build/fs-uae/native/Alerts
            build/fs-uae/native/Handlers
            build/fs-uae/native/InputInfo
            build/fs-uae/native/Doctor
            build/fs-uae/native/Snapshot
            build/fs-uae/native/SnapDiff
            build/fs-uae/native/Timer
            build/fs-uae/native/Bench
            build/fs-uae/native/WatchTask
            build/fs-uae/native/Info.sha256
            build/fs-uae/native/file.txt
            build/fs-uae/native/result.txt
            build/fs-uae/native/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-guest/result.txt
            build/fs-uae/aros-guest/fs-uae.log
            build/fs-uae/aros-guest/fs-uae-version.txt
            build/fs-uae/aros-guest/aros-guest.fs-uae
            build/fs-uae/m3-batch1/result.txt
            build/fs-uae/m3-batch1/fs-uae.log
            build/fs-uae/m3-batch1/fs-uae-version.txt
            build/fs-uae/m3-batch1/aros-guest.fs-uae
            build/fs-uae/m3-batch2/result.txt
            build/fs-uae/m3-batch2/fs-uae.log
            build/fs-uae/m3-batch2/fs-uae-version.txt
            build/fs-uae/m3-batch2/aros-guest.fs-uae
            build/fs-uae/m3-batch3/result.txt
            build/fs-uae/m3-batch3/fs-uae.log
            build/fs-uae/m3-batch3/fs-uae-version.txt
            build/fs-uae/m3-batch3/aros-guest.fs-uae
            build/fs-uae/m4-batch1/result.txt
            build/fs-uae/m4-batch1/fs-uae.log
            build/fs-uae/m4-batch1/fs-uae-version.txt
            build/fs-uae/m4-batch1/aros-guest.fs-uae
            build/fs-uae/m4-batch2/result.txt
            build/fs-uae/m4-batch2/fs-uae.log
            build/fs-uae/m4-batch2/fs-uae-version.txt
            build/fs-uae/m4-batch2/aros-guest.fs-uae
          if-no-files-found: warn
